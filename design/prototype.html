function openGroupForm(tr, g) {
  openModal({
    title: g ? t('renameGroup') : t('newGroup'), submitLabel: g ? t('save') : t('add'),
    body: field('name', t('f_groupName'), input('name', g ? g.title : '', `placeholder="${t('ph_group')}" maxlength="40"`), { required: true }),
    validate: (d) => ((d.name || '').trim() ? {} : { name: t('errName') }),
    onSubmit: (d) => { if (g) g.title = d.name.trim(); else tr.groups.push({ id: uid(), kind: 'packing', title: d.name.trim(), items: [] }); },
  });
}
function confirmDialog({ title, message, confirmLabel, onConfirm }) {
  openModal({ title, body: `<p class="msg">${message}</p>`, submitLabel: confirmLabel || t('delete'), danger: true, onSubmit: onConfirm });
}

/* =====================================================================
   Toast (with optional undo)
   ===================================================================== */
let toastTimer, toastUndo = null;
function toast(msg, undo) {
  const el = document.getElementById('toast');
  toastUndo = undo || null;
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? `<button type="button" data-action="toast-undo">${t('undo')}</button>` : ''}`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); toastUndo = null; }, undo ? 5000 : 2400);
}

/* =====================================================================
   Events
   ===================================================================== */
const currentTrip = (el) => {
  const id = el && el.dataset && el.dataset.trip;
  if (id) return getTrip(id);
  const r = route(); return r.name === 'trip' ? getTrip(r.id) : null;
};
let suppressClick = false;

document.addEventListener('click', (e) => {
  if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; return; }
  if (e.target.matches('[data-overlay]')) { closeModal(); return; }
  if (ui.themeMenu && !e.target.closest('.theme-wrap')) { ui.themeMenu = false; renderHeader(); }
  const a = e.target.closest('[data-action]');
  const link = e.target.closest('[data-href]');
  if (!a && link) { location.hash = link.dataset.href; return; }
  if (!a) return;
  const act = a.dataset.action;
  const tr = currentTrip(a);

  switch (act) {
    case 'lang': state.settings.language = a.dataset.v; commit(); break;
    case 'theme-menu': ui.themeMenu = !ui.themeMenu; renderHeader(); break;
    case 'theme': state.settings.theme = a.dataset.v; ui.themeMenu = false; commit(); break;
    case 'close-modal': closeModal(); break;
    case 'status': ui.status = a.dataset.v; render(); break;
    case 'sort': { const k = a.dataset.v; if (ui.sort === k) ui.dir = ui.dir === 'asc' ? 'desc' : 'asc'; else { ui.sort = k; ui.dir = k === 'ready' || k === 'spent' ? 'desc' : 'asc'; } render(); break; }
    case 'reset-filters': ui.q = ''; ui.status = 'all'; render(); break;
    case 'new-trip': openTripForm(); break;
    case 'edit-trip': openTripForm(getTrip(a.dataset.id)); break;
    case 'delete-trip': {
      const trip = getTrip(a.dataset.id);
      confirmDialog({ title: t('deleteTripQ'), message: t('deleteTripMsg', { t: esc(trip.title) }), onConfirm: () => {
        state.trips = state.trips.filter((x) => x.id !== trip.id);
        if (route().name === 'trip') location.hash = '#/';
        toast(t('deleted'));
      } });
      break;
    }
    case 'board-scroll': { const b = document.querySelector('[data-board="plan"]'); b && b.scrollBy({ left: +a.dataset.dir * (252 * 3), behavior: 'smooth' }); break; }
    case 'mday': ui.mDay[tr.id] = a.dataset.v; render(); break;
    case 'add-stop': openStopForm(tr, a.dataset.day || null); break;
    case 'edit-stop': openStopForm(tr, null, tr.items[a.dataset.id]); break;
    case 'delete-stop': {
      const it = tr.items[a.dataset.id];
      closeModal();
      confirmDialog({ title: t('deleteStopQ'), message: t('deleteMsg', { t: esc(it.title) }), onConfirm: () => { deleteStop(tr, it.id); toast(t('deleted')); } });
      break;
    }
    case 'mark-done': {
      const it = tr.items[a.dataset.id]; it.done = true; commit();
      toast(t('markedDone', { t: it.title }), () => { it.done = false; commit(); });
      break;
    }
    case 'toast-undo': if (toastUndo) { toastUndo(); toastUndo = null; document.getElementById('toast').classList.remove('show'); } break;
    case 'start-add': ui.adding = a.dataset.group; pendingFocus = `.inline-add[data-group="${a.dataset.group}"] input[name="text"]`; render(); break;
    case 'cancel-add': ui.adding = null; render(); break;
    case 'delete-ck': {
      const ct = tr || state.trips.find((x) => findCk(x, a.dataset.id));
      const f = findCk(ct, a.dataset.id);
      if (f.item.sourceItemId && ct.items[f.item.sourceItemId]) { ct.items[f.item.sourceItemId].needsBooking = false; ct.items[f.item.sourceItemId].bookingTaskId = ''; }
      f.group.items = f.group.items.filter((x) => x !== f.item); commit(); break;
    }
    case 'ck-filter': ui.ckFilter = a.dataset.v; render(); break;
    case 'add-group': openGroupForm(tr); break;
    case 'rename-group': openGroupForm(tr, tr.groups.find((g) => g.id === a.dataset.id)); break;
    case 'delete-group': {
      const g = tr.groups.find((x) => x.id === a.dataset.id);
      confirmDialog({ title: t('deleteGroupQ'), message: t('deleteGroupMsg', { t: esc(g.title) }), onConfirm: () => { tr.groups = tr.groups.filter((x) => x !== g); toast(t('deleted')); } });
      break;
    }
    case 'add-expense': openExpenseForm(tr); break;
    case 'edit-expense': openExpenseForm(tr, tr.expenses.find((x) => x.id === a.dataset.id)); break;
    case 'delete-expense': {
      const ex = tr.expenses.find((x) => x.id === a.dataset.id);
      confirmDialog({ title: t('deleteExpenseQ'), message: t('deleteMsg', { t: esc(ex.title) }), onConfirm: () => { tr.expenses = tr.expenses.filter((x) => x !== ex); toast(t('deleted')); } });
      break;
    }
    case 'reset-demo':
      confirmDialog({ title: t('resetDemoQ'), message: t('resetDemoMsg'), confirmLabel: t('reset'), onConfirm: () => {
        state = seed(L()); Object.assign(ui, { q: '', status: 'all', cat: 'all', expCat: 'all', ckFilter: 'all', mDay: {}, adding: null }); location.hash = '#/';
      } });
      break;
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (modal) closeModal();
    else if (ui.themeMenu) { ui.themeMenu = false; renderHeader(); }
    else if (ui.adding && e.target.closest('.inline-add')) { ui.adding = null; render(); }
  }
  if (e.key === 'Enter' && !modal) {
    if (e.target.matches('[data-href]')) location.hash = e.target.dataset.href;
    else if (e.target.matches('[data-drag], .nrow')) e.target.click();
  }
});

document.addEventListener('input', (e) => {
  if (e.target.id === 'search') { ui.q = e.target.value; document.getElementById('results').innerHTML = renderResults(); return; }
  const form = e.target.closest('#modal-form');
  if (form && modal) { modal.touched.add(e.target.name); const f = e.target.closest('.field'); if (modal.submitted || (f && f.classList.contains('invalid'))) showErrors(form); }
  const ia = e.target.closest('.inline-add');
  if (ia) ia.querySelector('.err').textContent = '';
});
document.addEventListener('focusout', (e) => {
  const form = e.target.closest && e.target.closest('#modal-form');
  if (form && modal && e.target.name && e.target.type !== 'radio' && e.target.type !== 'checkbox') { modal.touched.add(e.target.name); showErrors(form); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.ui === 'sortCombo') { const [s, d] = el.value.split('_'); ui.sort = s; ui.dir = d; render(); return; }
  if (el.dataset.ui) { ui[el.dataset.ui] = el.value; render(); return; }
  if (el.dataset.ck) {
    const r = route();
    const tr = r.name === 'trip' ? getTrip(r.id) : state.trips.find((x) => findCk(x, el.dataset.ck));
    const f = findCk(tr, el.dataset.ck); f.item.done = el.checked;
    pendingFocus = `[data-ck="${f.item.id}"]`; commit(); return;
  }
  const form = el.closest('#modal-form');
  if (form) {
    if (el.name === 'where') form.querySelector('[data-name="dayId"]').hidden = el.value !== 'day';
    if (el.name === 'needsBooking') form.querySelector('[data-name="bookBy"]').hidden = !el.checked;
  }
});

document.addEventListener('submit', (e) => {
  e.preventDefault();
  const form = e.target;
  if (form.id === 'modal-form' && modal) {
    modal.submitted = true;
    const errs = showErrors(form);
    if (Object.keys(errs).length) { form.querySelector('.field.invalid .input, .field.invalid .select, .field.invalid .textarea')?.focus(); return; }
    const m = modal; const d = formData(form);
    closeModal(); m.onSubmit(d); commit();
    return;
  }
  if (form.dataset.form === 'ck-add') {
    const text = form.elements.text.value.trim();
    if (!text) { form.querySelector('.err').textContent = t('errRequired'); form.elements.text.focus(); return; }
    const tr = currentTrip(form) || state.trips.find((x) => x.groups.some((g) => g.id === form.dataset.group));
    const g = tr.groups.find((x) => x.id === form.dataset.group);
    g.items.push({ id: uid(), text, done: false, dueDate: form.elements.dueDate ? form.elements.dueDate.value : '', sourceItemId: '' });
    pendingFocus = `.inline-add[data-group="${g.id}"] input[name="text"]`;
    commit();
  }
});

/* =====================================================================
   Drag & drop — pointer events (mouse: drag after 6px; touch: long-press 380ms)
   In the real app this is dnd-kit (PointerSensor + TouchSensor with delay).
   ===================================================================== */
let dnd = null;
document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0 || modal) return;
  const card = e.target.closest('[data-drag]');
  if (!card || e.target.closest('button, input, select, textarea, a')) return;
  dnd = { card, id: card.dataset.drag, x0: e.clientX, y0: e.clientY, x: e.clientX, y: e.clientY, active: false, touch: e.pointerType !== 'mouse' };
  if (!dnd.touch) e.preventDefault(); // no text selection while dragging with a mouse
  if (dnd.touch) dnd.timer = setTimeout(() => { if (dnd && !dnd.active) { startDrag(); navigator.vibrate && navigator.vibrate(12); } }, 380);
});
document.addEventListener('pointermove', (e) => {
  if (!dnd) return;
  dnd.x = e.clientX; dnd.y = e.clientY;
  if (!dnd.active) {
    const dist = Math.hypot(dnd.x - dnd.x0, dnd.y - dnd.y0);
    if (dnd.touch) { if (dist > 10) { clearTimeout(dnd.timer); dnd = null; } return; }
    if (dist < 6) return;
    startDrag();
  }
  e.preventDefault();
  moveDrag();
});
document.addEventListener('pointerup', () => {
  if (!dnd) return;
  clearTimeout(dnd.timer);
  if (dnd.active) { finishDrag(true); suppressClick = true; setTimeout(() => (suppressClick = false), 0); }
  dnd = null;
});
document.addEventListener('pointercancel', () => { if (!dnd) return; clearTimeout(dnd.timer); if (dnd.active) finishDrag(false); dnd = null; });
document.addEventListener('touchmove', (e) => { if (dnd && dnd.active) e.preventDefault(); }, { passive: false });
document.addEventListener('contextmenu', (e) => { if (e.target.closest('[data-drag]')) e.preventDefault(); });

function startDrag() {
  const c = dnd.card, r = c.getBoundingClientRect();
  dnd.active = true; dnd.dx = dnd.x0 - r.left; dnd.dy = dnd.y0 - r.top;
  const g = c.cloneNode(true);
  g.classList.add('ghost'); g.classList.remove('dim'); g.style.width = r.width + 'px';
  document.body.appendChild(g); dnd.ghost = g;
  dnd.ph = document.createElement('div'); dnd.ph.className = 'ph';
  dnd.ph.style.height = r.height + 'px';
  c.classList.add('drag-src'); document.body.classList.add('dragging');
  moveDrag();
  dnd.raf = requestAnimationFrame(autoScroll);
}
function moveDrag() {
  const { x, y } = dnd;
  dnd.ghost.style.transform = `translate(${x - dnd.dx}px, ${y - dnd.dy}px) rotate(-2.5deg)`;
  const el = document.elementFromPoint(x, y);
  const list = el && el.closest('[data-drop]');
  document.querySelectorAll('.drop-hl').forEach((l) => l !== list && l.classList.remove('drop-hl'));
  if (!list) { dnd.ph.remove(); dnd.target = null; return; }
  list.classList.add('drop-hl');
  const horiz = list.dataset.axis === 'x';
  dnd.ph.style.width = horiz ? '72px' : '';
  dnd.ph.style.height = horiz ? '40px' : dnd.card.getBoundingClientRect().height + 'px';
  const cards = [...list.querySelectorAll(':scope > [data-drag]')].filter((c) => c !== dnd.card);
  const before = cards.find((c) => { const r = c.getBoundingClientRect(); return horiz ? x < r.left + r.width / 2 : y < r.top + r.height / 2; });
  if (before) { if (dnd.ph.nextSibling !== before) list.insertBefore(dnd.ph, before); }
  else { const add = list.querySelector(':scope > .ichip.add'); if (add) list.insertBefore(dnd.ph, add); else list.appendChild(dnd.ph); }
  dnd.target = { key: list.dataset.drop, beforeId: before ? before.dataset.drag : null };
}
function autoScroll() {
  if (!dnd || !dnd.active) return;
  let moved = false;
  const b = document.querySelector('[data-board="plan"]');
  if (b && b.offsetParent) {
    const r = b.getBoundingClientRect();
    if (dnd.y > r.top && dnd.y < r.bottom) {
      if (dnd.x < r.left + 70) { b.scrollLeft -= 14; moved = true; }
      else if (dnd.x > r.right - 70) { b.scrollLeft += 14; moved = true; }
    }
  }
  if (dnd.y < 70) { scrollBy(0, -12); moved = true; }
  else if (dnd.y > innerHeight - 70) { scrollBy(0, 12); moved = true; }
  if (moved) moveDrag();
  dnd.raf = requestAnimationFrame(autoScroll);
}
function finishDrag(apply) {
  cancelAnimationFrame(dnd.raf);
  dnd.ghost.remove(); dnd.ph.remove();
  dnd.card.classList.remove('drag-src'); document.body.classList.remove('dragging');
  document.querySelectorAll('.drop-hl').forEach((l) => l.classList.remove('drop-hl'));
  if (apply && dnd.target) { const tr = currentTrip(); moveItem(tr, dnd.id, dnd.target.key, dnd.target.beforeId); commit(); }
}

/* =====================================================================
   Boot
   ===================================================================== */
addEventListener('hashchange', () => { ui.adding = null; render(); });
render();
</script>
</body>
</html>
