<!doctype html>
<html lang="ru" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>waypoint — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   Design tokens — waypoint
   ===================================================================== */
:root {
  --font: 'Anonymous Pro', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  /* base palette */
  --cafe: #4C3D19; --kombu: #354024; --moss: #889063; --tan: #CFBB99; --bone: #E5D7C4;

  /* light theme */
  --page: #EFE6D8; --card: #FAF6EF; --inset: #E5D7C4; --inset-2: #EADFCB; --moss-tint: #E1E2CD;
  --border: #CFBB99; --heading: #4C3D19; --text: #354024; --muted: #62563E;
  --primary: #354024; --on-primary: #F1E8DA; --accent: #889063; --track: #E5D7C4;
  --error: #A3472B; --ochre: #B08A3E;
  --shadow: 0 1px 2px rgba(76,61,25,.06), 0 4px 14px rgba(76,61,25,.06);
  --shadow-sm: 0 1px 2px rgba(76,61,25,.08);
  --shadow-lg: 0 18px 40px rgba(53,64,36,.28);
  --overlay: rgba(60,55,40,.55);

  /* category colors */
  --c-sight: #889063; --c-food: #CFBB99; --c-transport: #354024; --c-stay: #4C3D19; --c-activity: #B08A3E;
  --c-shopping: #889063; --c-other: #9A8F7A;

  --r-card: 28px; --r-item: 18px; --r-input: 14px;
  color-scheme: light;
}
[data-theme="dark"] {
  --page: #1B2013; --card: #283019; --inset: #323C22; --inset-2: #2E371F; --moss-tint: #3A4529;
  --border: #4B5636; --heading: #F1E8DA; --text: #F1E8DA; --muted: #CFBB99;
  --primary: #889063; --on-primary: #1B2013; --accent: #A4AD7C; --track: #323C22;
  --error: #E59A7E; --ochre: #D2AA5C;
  --shadow: none; --shadow-sm: none; --shadow-lg: 0 18px 40px rgba(0,0,0,.55);
  --overlay: rgba(0,0,0,.6);
  --c-sight: #A4AD7C; --c-food: #CFBB99; --c-transport: #E5D7C4; --c-stay: #C08F6C; --c-activity: #D2AA5C;
  --c-shopping: #7FA08A; --c-other: #8C8472;
  color-scheme: dark;
}

/* =====================================================================
   Base
   ===================================================================== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--page); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; transition: background-color .2s, color .2s; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; color: var(--heading); font-weight: 700; }
h1 { font-size: 28px; line-height: 1.15; }
h2 { font-size: 17px; }
.meta { font-size: 13px; color: var(--muted); }
.label { font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

/* =====================================================================
   Controls
   ===================================================================== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 42px; padding: 0 20px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); color: var(--text); font-weight: 700; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background-color .15s, filter .15s; }
.btn:hover { background: var(--inset-2); }
.btn-primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary); filter: brightness(1.12); }
.btn-danger { background: var(--error); border-color: var(--error); color: #FAF6EF; }
.btn-danger:hover { background: var(--error); filter: brightness(1.08); }
[data-theme="dark"] .btn-danger { color: #1B2013; }
.btn-danger-outline { color: var(--error); }
.btn-sm { height: 34px; padding: 0 14px; font-size: 13px; }
.circle-btn { width: 42px; height: 42px; flex: none; border-radius: 50%; border: 1px solid var(--border); background: var(--card); display: grid; place-items: center; cursor: pointer; font-size: 17px; font-weight: 700; color: var(--text); }
.circle-btn:hover { background: var(--inset-2); }
.circle-btn.sm { width: 34px; height: 34px; font-size: 14px; }
.sq-btn { width: 38px; height: 38px; flex: none; border-radius: 13px; border: 1px solid var(--border); background: var(--card); display: grid; place-items: center; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--text); }
.sq-btn:hover { background: var(--inset-2); }
.sq-btn.danger { color: var(--error); }
.mini-btn { width: 24px; height: 24px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-weight: 700; display: grid; place-items: center; flex: none; }
.mini-btn:hover { background: var(--inset-2); color: var(--text); }
.mini-btn.danger:hover { color: var(--error); }

.pillseg { display: inline-flex; gap: 2px; padding: 4px; background: var(--inset); border-radius: 999px; max-width: 100%; }
.pillseg > * { border: 0; background: none; height: 34px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: 13px; color: var(--text); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; }
.pillseg > *:hover { background: color-mix(in srgb, var(--card) 55%, transparent); }
.pillseg > [aria-pressed="true"], .pillseg > [aria-current="page"], .pillseg input:checked + span { background: var(--primary); color: var(--on-primary); }
.pillseg.sm > * { height: 28px; padding: 0 12px; font-size: 12px; }
.pillseg.full { display: flex; }
.pillseg.full > * { flex: 1; }

.input, .select, .textarea { width: 100%; height: 44px; padding: 0 14px; border: 1px solid var(--border); border-radius: var(--r-input); background: var(--card); color: var(--text); transition: border-color .15s, box-shadow .15s; }
.textarea { height: auto; min-height: 76px; padding: 10px 14px; resize: vertical; }
.select { appearance: none; padding-right: 34px; cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
.select.pill { border-radius: 999px; width: auto; }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--moss-tint); }
.input::placeholder, .textarea::placeholder { color: var(--muted); opacity: .75; }
.input.search { border-radius: 999px; background: var(--inset-2); border-color: transparent; }
.input-sm { height: 36px; border-radius: 12px; padding: 0 12px; }

input[type="checkbox"].ck { appearance: none; -webkit-appearance: none; width: 20px; height: 20px; margin: 0; flex: none; border: 1.5px solid var(--heading); border-radius: 5px; background: var(--card); display: grid; place-items: center; cursor: pointer; }
input[type="checkbox"].ck:checked { background: var(--primary); border-color: var(--primary); }
input[type="checkbox"].ck:checked::after { content: ""; width: 10px; height: 5px; border-left: 2px solid var(--on-primary); border-bottom: 2px solid var(--on-primary); transform: translateY(-1px) rotate(-45deg); }

.bar { height: 8px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--accent); transition: width .3s; }
.bar.over > i { background: var(--error); }

.badge { display: inline-flex; align-items: center; height: 26px; padding: 0 12px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-ongoing { background: var(--primary); color: var(--on-primary); }
.b-upcoming { background: var(--moss-tint); color: var(--text); }
.b-past { background: var(--inset-2); color: var(--text); }

.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); flex: none; display: inline-block; }
.cat { display: inline-flex; align-items: center; gap: 7px; }

.av { width: 48px; height: 48px; flex: none; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-size: 18px; }
.av.lg { width: 56px; height: 56px; border-radius: 16px; font-size: 21px; }
.av-0 { background: var(--tan); color: var(--cafe); }
.av-1 { background: var(--moss); color: #FAF6EF; }
.av-2 { background: var(--kombu); color: var(--bone); }
.av-3 { background: var(--bone); color: var(--cafe); }
.av-4 { background: var(--cafe); color: var(--bone); }
[data-theme="dark"] .av-2 { background: #3F4B2A; }
[data-theme="dark"] .av-3 { background: #E5D7C4; }

.card { background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); }

/* =====================================================================
   App bar
   ===================================================================== */
.appbar { position: sticky; top: 12px; z-index: 40; max-width: 1360px; margin: 12px auto 0; display: flex; align-items: center; gap: 16px; padding: 10px 12px; background: var(--card); border-radius: var(--r-card); box-shadow: var(--shadow); }
.appbar-wrap { padding: 0 24px; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; color: var(--heading); }
.logo-mark { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-weight: 700; font-size: 16px; }
.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav a { height: 42px; padding: 0 20px; border-radius: 999px; display: inline-flex; align-items: center; font-weight: 700; }
.nav a:hover { background: var(--inset-2); }
.nav a[aria-current="page"] { background: var(--primary); color: var(--on-primary); }
.spacer { flex: 1; }
.me { width: 42px; height: 42px; border-radius: 50%; background: var(--tan); color: var(--cafe); display: grid; place-items: center; font-weight: 700; }
.theme-wrap { position: relative; }
.menu { position: absolute; right: 0; top: 50px; z-index: 50; min-width: 200px; padding: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow-lg); animation: pop .14s ease-out; }
.menu button { width: 100%; display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 12px; border: 0; border-radius: 12px; background: none; cursor: pointer; font-weight: 700; text-align: left; }
.menu button:hover { background: var(--inset-2); }
.menu button .ico { width: 20px; text-align: center; }
.menu button .chk { margin-left: auto; opacity: 0; }
.menu button[aria-checked="true"] .chk { opacity: 1; }

main { max-width: 1360px; margin: 0 auto; padding: 28px 24px 40px; }
.proto-foot { max-width: 1360px; margin: 0 auto; padding: 0 24px 32px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.proto-foot button { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; padding: 0; }

/* =====================================================================
   Trips page
   ===================================================================== */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 18px; }
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px; margin-bottom: 18px; }
.toolbar .search { flex: 1 1 280px; }
.toolbar .sort-m { display: none; }

.table { padding: 14px 12px; }
.trow { display: grid; grid-template-columns: minmax(230px, 2.3fr) 1.15fr .5fr 1.4fr 1.1fr 1.05fr 92px; align-items: center; gap: 18px; padding: 10px 12px; border-radius: 22px; }
.trow.head { padding: 6px 12px 8px; }
.trow:not(.head) { cursor: pointer; transition: background-color .12s; }
.trow:not(.head):hover { background: var(--inset-2); }
.trow:not(.head):hover .t-title { text-decoration: underline; }
.th { border: 0; background: none; padding: 0; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--heading); text-align: left; }
.th.static { cursor: default; }
.th .arr { opacity: .45; letter-spacing: 0; }
.th.on .arr { opacity: 1; }
.t-trip { display: flex; align-items: center; gap: 12px; min-width: 0; }
.t-title { font-weight: 700; color: var(--heading); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t-bar .meta { margin-top: 4px; }
.t-actions { display: flex; gap: 8px; justify-content: flex-end; }

.cards { display: none; flex-direction: column; gap: 12px; }
.tcard { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 14px; border-radius: 24px; cursor: pointer; }
.tcard .av { width: 64px; height: 64px; border-radius: 18px; font-size: 22px; }
.tcard .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 2px 0 8px; }
.fab { display: none; position: fixed; right: 16px; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 35; height: 56px; padding: 0 24px; border-radius: 999px; border: 0; background: var(--primary); color: var(--on-primary); font-weight: 700; font-size: 15px; box-shadow: var(--shadow-lg); cursor: pointer; }

.empty { text-align: center; padding: 64px 24px; }
.empty .e-ic { width: 120px; height: 120px; margin: 0 auto 18px; border-radius: 50%; background: var(--inset); display: grid; place-items: center; font-size: 40px; color: var(--muted); }
.empty h2 { font-size: 20px; margin-bottom: 8px; }
.empty p { color: var(--muted); margin: 0 auto 18px; max-width: 340px; }

/* =====================================================================
   Trip page
   ===================================================================== */
.trip-head { padding: 20px; margin-bottom: 18px; }
.th-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.th-main { flex: 1 1 260px; min-width: 0; }
.th-title { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.th-ready { flex: 0 1 240px; min-width: 180px; }
.th-ready .top { display: flex; justify-content: space-between; margin-bottom: 6px; }
.th-ready b { font-size: 13px; }
.th-actions { display: flex; gap: 10px; }
.th-notes { margin-top: 14px; padding: 10px 14px; border-radius: 14px; background: var(--inset-2); font-size: 13px; color: var(--muted); }
.tabs-row { margin-top: 16px; }
.th-actions .ico { display: none; }

.subbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.subbar .left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- board ---------- */
.board { position: relative; display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; padding: 2px 2px 14px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.col { flex: 0 0 238px; display: flex; flex-direction: column; gap: 10px; padding: 14px; border-radius: 24px; background: var(--inset); scroll-snap-align: start; }
.col.ideas { flex-basis: 262px; background: transparent; border: 1.5px dashed var(--border); }
.col.today { box-shadow: inset 0 0 0 2px var(--accent); }
.col-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-weight: 700; color: var(--heading); }
.col-head .cnt { font-size: 12px; color: var(--muted); }
.col-head .left { display: flex; align-items: center; gap: 8px; min-width: 0; }
.col-head .gtitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill-count { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: var(--primary); color: var(--on-primary); white-space: nowrap; }
.pill-count.ok { background: var(--moss-tint); color: var(--text); }
.today-tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: var(--primary); color: var(--on-primary); }
.col-hint { font-size: 12.5px; color: var(--muted); margin-top: -4px; }
.list { display: flex; flex-direction: column; gap: 10px; min-height: 12px; border-radius: 16px; transition: background-color .12s; }
.list.drop-hl { background: var(--moss-tint); outline: 1.5px dashed var(--accent); outline-offset: 4px; }
.empty-drop { font-size: 12.5px; color: var(--muted); text-align: center; padding: 14px 6px; border: 1.5px dashed var(--border); border-radius: 16px; }
.list:has(.ph) .empty-drop { display: none; }
.add-dashed { height: 40px; border-radius: 14px; border: 1.5px dashed var(--border); background: transparent; font-weight: 700; font-size: 13px; cursor: pointer; color: var(--text); }
.add-dashed:hover { background: var(--card); }

.icard { background: var(--card); border-radius: var(--r-item); padding: 12px 14px; cursor: grab; box-shadow: var(--shadow-sm); user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; transition: opacity .15s; }
.icard:hover { box-shadow: 0 0 0 1.5px var(--border); }
.icard .top { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; color: var(--heading); }
.icard .ttl { overflow-wrap: break-word; min-width: 0; }
.icard .sub { font-size: 13px; color: var(--muted); margin-top: 3px; overflow-wrap: break-word; }
.icard .cat { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.icard .cat .dot { margin-right: 7px; vertical-align: 0; }
.icard .bk { font-size: 12px; font-weight: 700; margin-top: 4px; color: var(--ochre); }
.icard .bk.ok { color: var(--accent); }
.icard .bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; font-size: 13px; }
.icard .grip { color: var(--tan); font-size: 13px; letter-spacing: -2px; }
.icard.dim { opacity: .28; }
.icard.done .ttl { text-decoration: line-through; opacity: .6; }
.icard.drag-src { opacity: .3; }
.ghost { position: fixed; left: 0; top: 0; z-index: 200; pointer-events: none; margin: 0; border: 1.5px solid var(--heading); box-shadow: var(--shadow-lg); }
.ph { flex: none; border-radius: var(--r-item); border: 1.5px dashed var(--accent); background: var(--moss-tint); }

.crow { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow-sm); }
.crow label { flex: 1; display: flex; align-items: center; gap: 10px; cursor: pointer; min-width: 0; }
.crow .body { display: flex; flex-direction: column; min-width: 0; }
.crow .txt { overflow-wrap: break-word; }
.crow.done .txt { text-decoration: line-through; color: var(--muted); }
.crow .due { font-size: 12px; margin-top: 1px; color: var(--muted); white-space: nowrap; }
.crow .due.overdue { color: var(--error); font-weight: 700; }
.crow .mini-btn { opacity: 0; }
.crow:hover .mini-btn, .crow:focus-within .mini-btn { opacity: 1; }
.col-head .mini-btn { opacity: .5; }
.col:hover .col-head .mini-btn { opacity: 1; }

.inline-add { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 14px; background: var(--card); }
.inline-add .row { display: flex; gap: 6px; }
.inline-add .err { color: var(--error); font-size: 12px; font-weight: 700; }
.inline-add .err:empty { display: none; }

/* mobile plan (hidden on desktop) */
.mplan, .sheet { display: none; }

/* ---------- expenses ---------- */
.exp-layout { display: grid; grid-template-columns: 330px 1fr; gap: 18px; align-items: start; }
.exp-side { display: flex; flex-direction: column; gap: 14px; }
.spent-card { background: var(--primary); color: var(--on-primary); border-radius: var(--r-card); padding: 20px 20px 22px; }
.spent-card .label { color: inherit; opacity: .8; }
.spent-card .big { font-size: 36px; font-weight: 700; line-height: 1.1; margin: 6px 0 4px; }
.spent-card .meta { color: inherit; opacity: .85; }
.cats { padding: 18px; }
.cats .label { margin-bottom: 14px; }
.cat-row { margin-bottom: 14px; }
.cat-row:last-child { margin-bottom: 0; }
.cat-row .top { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 6px; font-size: 14px; }
.cat-row .top b { font-variant-numeric: tabular-nums; }
.cat-row .bar > i { background: var(--c); }
.exp-table { padding: 14px; }
.exp-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.exp-tools .spacer { flex: 1; }
.erow { display: grid; grid-template-columns: 96px 1fr 170px 120px 84px; align-items: center; gap: 12px; padding: 12px 12px; border-top: 1px solid var(--inset); }
.erow.head { border-top: 0; padding-bottom: 8px; }
.erow .amt { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.erow .what { font-weight: 700; color: var(--heading); overflow-wrap: anywhere; }
.erow .acts { display: flex; gap: 6px; justify-content: flex-end; }
.erow .acts .sq-btn { width: 34px; height: 34px; border-radius: 11px; }
.erow .m-sub { display: none; }
.exp-foot { display: flex; justify-content: space-between; align-items: center; padding: 14px 12px 4px; border-top: 1px solid var(--inset); }
.exp-foot b { font-size: 17px; color: var(--heading); }

/* ---------- checklist ---------- */
.ck-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
.ck-bar .spacer { flex: 1; }
.board.ck { align-items: flex-start; }

/* ---------- today ---------- */
.today { max-width: 680px; margin: 0 auto; }
.today-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
.now-card { background: var(--primary); color: var(--on-primary); border-radius: var(--r-card); padding: 22px; margin-bottom: 22px; }
.now-card .label { color: inherit; opacity: .8; }
.now-card h2 { color: inherit; font-size: 26px; margin: 8px 0 4px; }
.now-card .meta { color: inherit; opacity: .85; }
.now-card .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.now-card .btn { height: 48px; background: transparent; color: inherit; border-color: color-mix(in srgb, var(--on-primary) 55%, transparent); }
.now-card .btn.fill { background: var(--bone); color: var(--kombu); border-color: var(--bone); }
[data-theme="dark"] .now-card .btn.fill { background: var(--page); color: var(--heading); border-color: var(--page); }
.sec-label { margin: 0 0 10px; }
.stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
.nrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--r-item); background: var(--card); box-shadow: var(--shadow-sm); cursor: pointer; }
.nrow b { color: var(--heading); display: block; }
.next-trip { padding: 20px; margin-bottom: 22px; }
.next-trip .row { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; }

/* ---------- bottom nav (mobile) ---------- */
.bnav { display: none; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; z-index: 100; background: var(--overlay); display: grid; place-items: center; padding: 16px; animation: fade .15s ease-out; }
.modal { width: 100%; max-width: 440px; max-height: calc(100vh - 32px); overflow: auto; background: var(--card); border-radius: 32px; box-shadow: var(--shadow-lg); animation: pop .18s ease-out; }
.modal form { padding: 26px; display: flex; flex-direction: column; gap: 14px; }
.modal header { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal header h2 { font-size: 22px; }
.modal .msg { margin: 0; color: var(--text); line-height: 1.6; }
.modal footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 4px; }
.form-summary { padding: 10px 14px; border-radius: 14px; background: var(--inset-2); color: var(--error); font-weight: 700; font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .flabel { font-weight: 700; font-size: 13.5px; color: var(--heading); }
.field .opt { color: var(--muted); font-weight: 400; }
.field.invalid .input, .field.invalid .select, .field.invalid .textarea { border: 1.5px solid var(--error); }
.field .err { color: var(--error); font-size: 12.5px; font-weight: 700; }
.field .err:empty { display: none; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips label { cursor: pointer; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips span { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); font-weight: 700; font-size: 12.5px; }
.chips input:checked + span { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.chips input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.check-line { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; font-size: 13.5px; }
.check-line .ck { margin-top: 1px; }
.pillseg input { position: absolute; opacity: 0; pointer-events: none; }
.pillseg label { padding: 0; }
.pillseg label span { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; border-radius: 999px; padding: 0 12px; }

/* ---------- toast ---------- */
.toast { position: fixed; left: 50%; bottom: 24px; z-index: 150; transform: translate(-50%, 16px); opacity: 0; pointer-events: none; display: flex; align-items: center; gap: 14px; padding: 12px 18px; border-radius: 999px; background: var(--heading); color: var(--page); font-weight: 700; font-size: 13.5px; box-shadow: var(--shadow-lg); transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: none; color: inherit; text-decoration: underline; font-weight: 700; cursor: pointer; padding: 0; }

@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } }

/* =====================================================================
   Responsive
   ===================================================================== */
@media (max-width: 1100px) {
  .trow { grid-template-columns: minmax(200px, 2fr) 1.1fr .45fr 1.3fr 1fr 1fr 88px; gap: 12px; }
  .exp-layout { grid-template-columns: 1fr; }
  .exp-side { display: grid; grid-template-columns: 1fr 1fr; }
}
@media (max-width: 860px) {
  .table { display: none; }
  .cards { display: flex; }
  .toolbar .sort-m { display: inline-block; }
}
@media (max-width: 720px) {
  .appbar-wrap { padding: 0 12px; }
  .appbar { top: 8px; margin-top: 8px; gap: 10px; padding: 8px; }
  .nav, .me, .logo-name { display: none; }
  main { padding: 20px 16px calc(110px + env(safe-area-inset-bottom)); }
  main.has-sheet { padding-bottom: calc(230px + env(safe-area-inset-bottom)); }
  .proto-foot { padding: 0 16px calc(110px + env(safe-area-inset-bottom)); }
  .page-head .btn-new { display: none; }
  .fab { display: block; }
  .toolbar { padding: 10px; border-radius: 22px; }
  .toolbar .pillseg { order: 3; width: 100%; overflow-x: auto; }
  .toolbar .sort-m { flex: 1; }

  .trip-head { padding: 16px; border-radius: 24px; }
  .th-row { gap: 12px; }
  .th-row > .circle-btn { order: 0; }
  .th-row .av { display: none; }
  .th-actions { order: 1; margin-left: auto; }
  .th-main { flex: 1 1 100%; order: 2; }
  .today-head .btn { display: none; }
  .th-actions .lbl { display: none; }
  .th-actions .ico { display: inline; }
  .th-actions .btn { width: 42px; padding: 0; }
  .th-ready { order: 4; flex: 1 1 100%; }
  .tabs-row { display: none; }
  h1 { font-size: 24px; }

  .board.plan, .plan-subbar { display: none; }
  .mplan { display: block; }
  .mchips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 16px; padding: 0 16px 4px; scrollbar-width: none; }
  .mchips button { flex: none; height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--card); font-weight: 700; cursor: pointer; white-space: nowrap; }
  .mchips button.before { background: var(--inset); border-color: var(--inset); }
  .mchips button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  .mday-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .fab-round { width: 52px; height: 52px; border-radius: 50%; border: 0; background: var(--primary); color: var(--on-primary); font-size: 24px; font-weight: 700; cursor: pointer; flex: none; }
  .sheet { display: block; position: fixed; left: 12px; right: 12px; bottom: calc(90px + env(safe-area-inset-bottom)); z-index: 30; padding: 10px 16px 14px; border-radius: 24px 24px 18px 18px; background: var(--inset); box-shadow: var(--shadow-lg); }
  .sheet .handle { width: 44px; height: 5px; border-radius: 9px; background: var(--border); margin: 0 auto 10px; }
  .sheet .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 10px; }
  .sheet .list.chipsx { flex-direction: row; gap: 8px; overflow-x: auto; padding: 2px; min-height: 42px; scrollbar-width: none; }
  .ichip { flex: none; height: 40px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; background: var(--card); border: 1px solid var(--border); font-weight: 700; cursor: grab; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; white-space: nowrap; }
  .ichip.add { border-style: dashed; background: transparent; cursor: pointer; }

  .exp-side { grid-template-columns: 1fr; }
  .erow.head { display: none; }
  .erow { grid-template-columns: 1fr auto auto; padding: 12px 6px; }
  .erow .d-date, .erow .d-cat { display: none; }
  .erow .m-sub { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .exp-tools .select { flex: 1; }
  .exp-tools .spacer { display: none; }
  .exp-tools .btn { width: 100%; }

  .board.ck { flex-direction: column; overflow: visible; }
  .board.ck .col { flex: none; width: 100%; }

  .bnav { display: flex; position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 40; padding: 8px; border-radius: 28px; background: var(--card); box-shadow: var(--shadow-lg); }
  .bnav a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; padding: 2px 0; }
  .bnav a .ic { width: 52px; height: 32px; border-radius: 999px; display: grid; place-items: center; font-size: 15px; }
  .bnav a[aria-current="page"] .ic { background: var(--primary); color: var(--on-primary); }
  .toast { bottom: calc(100px + env(safe-area-inset-bottom)); }
  .grid2 { grid-template-columns: 1fr 1fr; }
  .overlay { place-items: end center; padding: 0; }
  .modal { border-radius: 28px 28px 0 0; max-height: 92vh; }
  .modal form { padding: 22px 18px calc(22px + env(safe-area-inset-bottom)); }
  .crow .mini-btn, .col-head .mini-btn { opacity: 1; }
}
@media (hover: none) { .crow .mini-btn { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

const spentOf = (tr) => tr.expenses.reduce((s, e) => s + e.amount, 0);

const packGroups = (tr) => tr.groups.filter((g) => g.kind === 'packing');
function ckStats(tr) {
  const packs = packGroups(tr).flatMap((g) => g.items);
  const tasks = tasksGroup(tr).items;
  return { packed: packs.filter((i) => i.done).length, packTotal: packs.length, tasksDone: tasks.filter((i) => i.done).length, tasksTotal: tasks.length };
}
/** Readiness = (packed + tasks done) / (all items). null → empty checklist */
function readiness(tr) {
  const s = ckStats(tr);

  return total ? Math.round(((s.packed + s.tasksDone) / total) * 100) : null;
}

  return state.trips.filter((x) => tripStatus(x) === 'upcoming').sort((a, b) => a.startDate.localeCompare(b.startDate))[0];
}
function statusBadge(tr, long = false) {
  const st = tripStatus(tr);
  if (st === 'ongoing') return `<span class="badge b-ongoing">${t('st_ongoing')}</span>`;
  if (st === 'past') return `<span class="badge b-past">${t('badge_past')}</span>`;
  const n = diffDays(TODAY, tr.startDate);
  if (long) return `<span class="badge b-upcoming">${n === 1 ? t('soonTomorrow') : t('soonIn', { n })}</span>`;
  const near = nearestUpcoming();
  const label = near && near.id === tr.id ? (n === 1 ? t('tomorrow') : t('inDays', { n })) : t('st_upcoming');
  return `<span class="badge b-upcoming">${label}</span>`;
}
const avClass = (tr) => 'av-' + ([...tr.id].reduce((s, c) => s + c.charCodeAt(0), 0) % 5);
const avLetter = (tr) => esc((tr.title.trim()[0] || '?').toUpperCase());

function filteredTrips() {
  const q = ui.q.trim().toLowerCase();
  const list = state.trips.filter((tr) => (!q || `${tr.title} ${tr.destination}`.toLowerCase().includes(q)) && (ui.status === 'all' || tripStatus(tr) === ui.status));
  const by = {
    title: (a, b) => a.title.localeCompare(b.title, L()),
    dates: (a, b) => a.startDate.localeCompare(b.startDate),
    ready: (a, b) => (readiness(a) ?? -1) - (readiness(b) ?? -1),
    spent: (a, b) => spentOf(a) - spentOf(b),

const applyTheme = () => { document.documentElement.dataset.theme = resolvedTheme(); };
const THEME_ICON = { system: '◐', light: '☀', dark: '☾' };

/* =====================================================================
   Router
   ===================================================================== */
function route() {
  const p = (location.hash.slice(1) || '/').split('/').filter(Boolean);
  if (!p.length) return { name: 'trips' };
  if (p[0] === 'today') return { name: 'today' };
  if (p[0] === 'trips' && p[1]) return { name: 'trip', id: p[1], tab: ['plan', 'expenses', 'checklist'].includes(p[2]) ? p[2] : 'plan' };
  return { name: 'notfound' };
}

/* =====================================================================
   Render: shell
   ===================================================================== */
const app = document.getElementById('app');
let lastRouteKey = '';
let pendingFocus = null;

function render() {
  applyTheme();
  document.documentElement.lang = L();
  const r = route();
  const key = r.name + (r.id || '') + (r.tab || '');
  const sameRoute = key === lastRouteKey;
  const boardScroll = {};
  if (sameRoute) document.querySelectorAll('[data-board]').forEach((b) => (boardScroll[b.dataset.board] = b.scrollLeft));

  renderHeader(r);
  let html = '';
  app.classList.remove('has-sheet');
  if (r.name === 'trips') html = renderTrips();
  else if (r.name === 'today') html = renderToday();
  else if (r.name === 'trip') { const tr = getTrip(r.id); html = tr ? renderTrip(tr, r.tab) : renderNotFound(); if (tr && r.tab === 'plan') app.classList.add('has-sheet'); }
  else html = renderNotFound();
  app.innerHTML = html;
  renderBottomNav(r);
  document.getElementById('foot').innerHTML = `<span>${t('protoNote', { d: fmtLong(TODAY) })}</span><button type="button" data-action="reset-demo">${t('resetDemo')}</button>`;

  if (!sameRoute) { scrollTo(0, 0); lastRouteKey = key; initBoard(r); }
  else document.querySelectorAll('[data-board]').forEach((b) => { if (boardScroll[b.dataset.board] != null) b.scrollLeft = boardScroll[b.dataset.board]; });
  updateDaysLabel();
  if (pendingFocus) { const el = document.querySelector(pendingFocus); el && el.focus(); pendingFocus = null; }
}
const commit = () => { persist(); render(); };

function renderHeader(r = route()) {
  const th = state.settings.theme;
  const cur = r.name === 'today' ? 'today' : 'trips';
  document.getElementById('appbar').innerHTML = `
    <a class="logo" href="#/"><span class="logo-mark">W</span><span class="logo-name">waypoint</span></a>
    <nav class="nav">
      <a href="#/" ${cur === 'trips' ? 'aria-current="page"' : ''}>${t('nav_trips')}</a>
      <a href="#/today" ${cur === 'today' ? 'aria-current="page"' : ''}>${t('nav_today')}</a>
    </nav>
    <div class="spacer"></div>
    <div class="pillseg sm" role="group" aria-label="Language">
      ${['en', 'ru'].map((v) => `<button type="button" data-action="lang" data-v="${v}" aria-pressed="${L() === v}">${v.toUpperCase()}</button>`).join('')}
    </div>
    <div class="theme-wrap">
      <button type="button" class="circle-btn" data-action="theme-menu" aria-haspopup="menu" aria-expanded="${ui.themeMenu}" title="${t('theme')}: ${t('th_' + th)}">${THEME_ICON[th]}</button>
      ${ui.themeMenu ? `<div class="menu" role="menu">
        ${['system', 'light', 'dark'].map((v) => `<button type="button" role="menuitemradio" aria-checked="${th === v}" data-action="theme" data-v="${v}"><span class="ico">${THEME_ICON[v]}</span>${t('th_' + v)}<span class="chk">✓</span></button>`).join('')}
      </div>` : ''}
    </div>
    <span class="me" aria-hidden="true">A</span>`;
}

function renderBottomNav(r) {
  const items = r.name === 'trip' && getTrip(r.id)
    ? [['#/today', '◉', t('nav_today'), false], ...['plan', 'expenses', 'checklist'].map((k, i) => [`#/trips/${r.id}/${k}`, ['▦', '€', '✓'][i], t('tab_' + k), r.tab === k])]
    : [['#/', '✈', t('nav_trips'), r.name === 'trips'], ['#/today', '◉', t('nav_today'), r.name === 'today']];
  document.getElementById('bnav').innerHTML = items.map(([h, ic, lbl, on]) => `<a href="${h}" ${on ? 'aria-current="page"' : ''}><span class="ic">${ic}</span>${lbl}</a>`).join('');
}

/* =====================================================================
   Trips page
   ===================================================================== */
function renderTrips() {
  const cnt = (s) => state.trips.filter((x) => tripStatus(x) === s).length;
  const head = `
    <div class="page-head">
      <div><h1>${t('nav_trips')}</h1><div class="meta">${tp('tripsCount', state.trips.length)} · ${t('nowCount', { n: cnt('ongoing') })} · ${t('soonCount', { n: cnt('upcoming') })}</div></div>
      <button class="btn btn-primary btn-new" data-action="new-trip">+ ${t('newTrip')}</button>
    </div>
    <button class="fab" data-action="new-trip">+ ${t('newTrip')}</button>`;
  if (!state.trips.length) return head + `
    <div class="card empty"><div class="e-ic">✈</div><h2>${t('noTrips')}</h2><p>${t('noTripsHint')}</p><button class="btn btn-primary" data-action="new-trip">+ ${t('newTrip')}</button></div>`;
  return head + `
    <div class="card toolbar">
      <input class="input search" id="search" type="search" placeholder="${t('search')}" value="${esc(ui.q)}" aria-label="${t('search')}">
      <div class="pillseg" role="group">
        ${['all', 'upcoming', 'ongoing', 'past'].map((s) => `<button type="button" data-action="status" data-v="${s}" aria-pressed="${ui.status === s}">${t('st_' + s)}</button>`).join('')}
      </div>
      <select class="select pill sort-m" data-ui="sortCombo" aria-label="Sort">
        ${['dates_asc', 'dates_desc', 'title_asc', 'ready_desc', 'spent_desc'].map((v) => `<option value="${v}" ${`${ui.sort}_${ui.dir}` === v ? 'selected' : ''}>${t('sort_' + v)}</option>`).join('')}
      </select>
    </div>
    <div id="results">${renderResults()}</div>`;
}

function renderResults() {
  const list = filteredTrips();
  if (!list.length) {
    const s = t('st_' + ui.status);
    return `<div class="card empty"><div class="e-ic">?</div><h2>${t('noResults')}</h2>
      <p>${ui.q.trim() ? t('noResultsQ', { q: esc(ui.q.trim()), s }) : t('noResultsS', { s })}</p>
      <button class="btn" data-action="reset-filters">${t('resetFilters')}</button></div>`;
  }
  const th = (key, label) => {
    const on = ui.sort === key;
    return `<button type="button" class="th ${on ? 'on' : ''}" data-action="sort" data-v="${key}" aria-sort="${on ? (ui.dir === 'asc' ? 'ascending' : 'descending') : 'none'}">${label} <span class="arr">${on ? (ui.dir === 'asc' ? '↑' : '↓') : '↑↓'}</span></button>`;
  };
  const rows = list.map((tr) => {
    const r = readiness(tr);
    const sp = spentOf(tr);
    return `
      <div class="trow" data-href="#/trips/${tr.id}" tabindex="0" role="link" aria-label="${esc(tr.title)}">
        <div class="t-trip"><div class="av ${avClass(tr)}">${avLetter(tr)}</div><div style="min-width:0"><div class="t-title">${esc(tr.title)}</div><div class="t-sub">${esc(tr.destination)}</div></div></div>
        <div class="num">${fmtRange(tr.startDate, tr.endDate)}</div>
        <div class="num">${tr.days.length}</div>
        <div class="t-bar"><div class="bar"><i style="width:${r ?? 0}%"></i></div><div class="meta">${r == null ? t('readyNone') : t('readyPct', { p: r })}</div></div>
        <div><b class="num">${money(sp, tr.currency)}</b><div class="meta">${tp('expensesCount', tr.expenses.length)}</div></div>
        <div>${statusBadge(tr)}</div>
        <div class="t-actions">
          <button class="sq-btn" data-action="edit-trip" data-id="${tr.id}" title="${t('edit')}" aria-label="${t('edit')}">✎</button>
          <button class="sq-btn danger" data-action="delete-trip" data-id="${tr.id}" title="${t('delete')}" aria-label="${t('delete')}">×</button>
        </div>
      </div>`;
  }).join('');
  const cards = list.map((tr) => {
    const r = readiness(tr);
    return `
      <article class="card tcard" data-href="#/trips/${tr.id}" tabindex="0" role="link" aria-label="${esc(tr.title)}">
        <div class="av ${avClass(tr)}">${avLetter(tr)}</div>
        <div style="min-width:0">
          <div class="t-title">${esc(tr.title)}</div>
          <div class="row"><span class="num">${fmtRange(tr.startDate, tr.endDate)}</span>${statusBadge(tr)}</div>
          <div class="bar"><i style="width:${r ?? 0}%"></i></div>
          <div class="meta" style="margin-top:4px">${r == null ? t('readyNone') : t('readyPct', { p: r })} · ${money(spentOf(tr), tr.currency)}</div>
        </div>
      </article>`;
  }).join('');
  return `
    <div class="card table" role="table">
      <div class="trow head" role="row">
        ${th('title', t('col_trip'))}${th('dates', t('col_dates'))}<span class="th static">${t('col_days')}</span>${th('ready', t('col_ready'))}${th('spent', t('col_spent'))}<span class="th static">${t('col_status')}</span><span></span>
      </div>
      ${rows}
    </div>
    <div class="cards">${cards}</div>`;
}

/* =====================================================================
   Trip page
   ===================================================================== */
function renderTrip(tr, tab) {
  const r = readiness(tr);
  const body = { plan: renderPlan, expenses: renderExpenses, checklist: renderChecklist }[tab](tr);
  return `
    <section class="card trip-head">
      <div class="th-row">
        <a class="circle-btn" href="#/" aria-label="${t('back')}">←</a>
        <div class="av lg ${avClass(tr)}">${avLetter(tr)}</div>
        <div class="th-main">
          <div class="th-title"><h1>${esc(tr.title)}</h1>${statusBadge(tr, true)}</div>
          <div class="meta">${fmtRange(tr.startDate, tr.endDate, true)} · ${tp('days', tr.days.length)} · ${esc(tr.destination)}</div>
        </div>
        <div class="th-ready">
          <div class="top"><span class="label">${t('ready')}</span><b class="num">${r == null ? '—' : r + '%'}</b></div>
          <div class="bar"><i style="width:${r ?? 0}%"></i></div>
        </div>
        <div class="th-actions">
          <button class="btn" data-action="edit-trip" data-id="${tr.id}" aria-label="${t('edit')}"><span class="lbl">${t('edit')}</span><span class="ico">✎</span></button>
          <button class="btn btn-danger-outline" data-action="delete-trip" data-id="${tr.id}" aria-label="${t('delete')}"><span class="lbl">${t('delete')}</span><span class="ico">×</span></button>
        </div>
      </div>
      ${tr.notes ? `<div class="th-notes">${esc(tr.notes)}</div>` : ''}
      <div class="tabs-row"><nav class="pillseg" aria-label="Sections">
        ${['plan', 'expenses', 'checklist'].map((k) => `<a href="#/trips/${tr.id}/${k}" ${tab === k ? 'aria-current="page"' : ''}>${t('tab_' + k)}</a>`).join('')}
      </nav></div>
    </section>
    ${body}`;
}

/* ---------- shared bits ---------- */
function itemCard(tr, it) {
  const dim = ui.cat !== 'all' && it.category !== ui.cat;
  const sub = [it.location, it.note, it.durationMin ? fmtDur(+it.durationMin) : ''].filter(Boolean).map(esc).join(' · ');
  let bk = '';
  if (it.needsBooking) {
    const task = it.bookingTaskId && findCk(tr, it.bookingTaskId);
    if (task && task.item.done) bk = `<div class="bk ok">${t('booked')}</div>`;
    else bk = `<div class="bk">${task && task.item.dueDate ? t('needsBookingBy', { d: fmtShort(task.item.dueDate) }) : t('needsBooking')}</div>`;
  }
  return `
    <div class="icard ${dim ? 'dim' : ''} ${it.done ? 'done' : ''}" data-drag="${it.id}" data-action="edit-stop" data-id="${it.id}" tabindex="0" role="button" aria-label="${esc(it.title)}">
      <div class="top"><span class="ttl">${it.done ? '✓ ' : ''}${esc(it.title)}</span>${it.time ? `<span class="num">${it.time}</span>` : ''}</div>
      ${sub ? `<div class="sub">${sub}</div>` : ''}
      ${bk}
      <div class="bottom"><span class="cat" style="--c:var(--c-${it.category})"><span class="dot"></span>${t('ic_' + it.category)}</span><span class="grip" aria-hidden="true">⠿</span></div>
    </div>`;
}

function ckRow(tr, g, it) {
  const overdue = it.dueDate && !it.done && it.dueDate < TODAY;
  return `
    <div class="crow ${it.done ? 'done' : ''}">
      <label><input type="checkbox" class="ck" data-ck="${it.id}" ${it.done ? 'checked' : ''}><span class="body"><span class="txt">${esc(it.text)}</span>${it.dueDate ? `<span class="due ${overdue ? 'overdue' : ''}">${fmtShort(it.dueDate)}</span>` : ''}</span></label>
      <button class="mini-btn danger" data-action="delete-ck" data-id="${it.id}" aria-label="${t('delete')}" title="${t('delete')}">×</button>
    </div>`;
}

function inlineAdd(g) {
  const isTask = g.kind === 'tasks';
  return `
    <form class="inline-add" data-form="ck-add" data-group="${g.id}" novalidate>
      <input class="input input-sm" name="text" placeholder="${t(isTask ? 'ph_task' : 'ph_packing')}" maxlength="120" autocomplete="off">
      ${isTask ? `<input class="input input-sm" type="date" name="dueDate" aria-label="${t('f_date')}">` : ''}
      <div class="err"></div>
      <div class="row"><button class="btn btn-primary btn-sm" type="submit">${t('add')}</button><button class="btn btn-sm" type="button" data-action="cancel-add">${t('cancel')}</button></div>
    </form>`;
}

function sortTasks(items) {
  return [...items].sort((a, b) => (a.done - b.done) || (a.dueDate || '9999').localeCompare(b.dueDate || '9999'));
}

/* ---------- Plan ---------- */
function renderPlan(tr) {
  const tg = tasksGroup(tr);
  const left = tg.items.filter((i) => !i.done).length;
  const todayIdx = tr.days.findIndex((d) => d.date === TODAY);

  const beforeCol = `
    <section class="col" id="col-before">
      <div class="col-head"><span>${t('beforeTrip')}</span><span class="pill-count ${left ? '' : 'ok'}">${left ? t('left', { n: left }) : t('allDone')}</span></div>
      <div class="list">${sortTasks(tg.items).map((it) => ckRow(tr, tg, it)).join('')}</div>
      ${ui.adding === tg.id ? inlineAdd(tg) : `<button class="add-dashed" data-action="start-add" data-group="${tg.id}">${t('addTask')}</button>`}
    </section>`;

  const dayCols = tr.days.map((d, i) => `
    <section class="col ${i === todayIdx ? 'today' : ''}" data-dayidx="${i}" id="col-${d.id}">
      <div class="col-head"><span class="left">${t('day', { n: i + 1 })} · ${wd(d.date)} ${parseISO(d.date).getDate()}${i === todayIdx ? ` <span class="today-tag">${t('today')}</span>` : ''}</span><span class="cnt">${d.itemIds.length}</span></div>
      <div class="list" data-drop="day:${d.id}">
        ${d.itemIds.map((id) => itemCard(tr, tr.items[id])).join('') || `<div class="empty-drop">${t('emptyDay')}</div>`}
      </div>
      <button class="add-dashed" data-action="add-stop" data-day="${d.id}">${t('addStop')}</button>
    </section>`).join('');

  const ideasCol = `
    <section class="col ideas" id="col-ideas">
      <div class="col-head"><span>${t('ideas')}</span><span class="label">${t('notScheduled')}</span></div>
      <div class="col-hint">${t('ideasHint')}</div>
      <div class="list" data-drop="ideas">
        ${tr.ideaIds.map((id) => itemCard(tr, tr.items[id])).join('') || `<div class="empty-drop">${t('emptyDay')}</div>`}
      </div>
      <button class="add-dashed" data-action="add-stop" data-day="">${t('addIdea')}</button>
    </section>`;

  /* mobile: chips + single column + ideas sheet */
  const sel = ui.mDay[tr.id] || (todayIdx > -1 ? tr.days[todayIdx].id : tr.days[0].id);
  const selDay = tr.days.find((d) => d.id === sel);
  const selIdx = tr.days.indexOf(selDay);
  const mchips = `
    <div class="mchips">
      <button class="before" data-action="mday" data-v="before" aria-pressed="${sel === 'before'}">${t('beforeShort')} · ${left}</button>
      ${tr.days.map((d) => `<button data-action="mday" data-v="${d.id}" aria-pressed="${sel === d.id}">${wd(d.date)} ${parseISO(d.date).getDate()}</button>`).join('')}
    </div>`;
  const mbody = sel === 'before' || !selDay
    ? `<div class="mday-head"><div><h2>${t('beforeTrip')}</h2><div class="meta">${t('mBeforeHint')}</div></div></div>
       <div class="list" style="gap:10px">${sortTasks(tg.items).map((it) => ckRow(tr, tg, it)).join('')}</div>
       <div style="margin-top:10px">${ui.adding === tg.id ? inlineAdd(tg) : `<button class="add-dashed" style="width:100%" data-action="start-add" data-group="${tg.id}">${t('addTask')}</button>`}</div>`
    : `<div class="mday-head"><div><h2>${t('day', { n: selIdx + 1 })} · ${fmtLong(selDay.date)}</h2><div class="meta">${t('mDayHint', { s: tp('stops', selDay.itemIds.length) })}</div></div>
         <button class="fab-round" data-action="add-stop" data-day="${selDay.id}" aria-label="${t('addStop')}">+</button></div>
       <div class="list" data-drop="day:${selDay.id}">${selDay.itemIds.map((id) => itemCard(tr, tr.items[id])).join('') || `<div class="empty-drop">${t('emptyDay')}</div>`}</div>`;

  return `
    <div class="subbar plan-subbar">
      <div class="left">
        <span class="label" id="days-label">${t('daysRange', { a: 1, b: Math.min(3, tr.days.length), n: tr.days.length })}</span>
        <button class="circle-btn sm" data-action="board-scroll" data-dir="-1" aria-label="‹">‹</button>
        <button class="circle-btn sm" data-action="board-scroll" data-dir="1" aria-label="›">›</button>
      </div>
      <select class="select pill" data-ui="cat" aria-label="${t('f_category')}">
        <option value="all">${t('catAll')}</option>
        ${ITEM_CATS.map((c) => `<option value="${c}" ${ui.cat === c ? 'selected' : ''}>${t('ic_' + c)}</option>`).join('')}
      </select>
    </div>
    <div class="board plan" data-board="plan">${beforeCol}${dayCols}${ideasCol}</div>
    <div class="mplan">${mchips}${mbody}</div>
    <div class="sheet">
      <div class="handle"></div>
      <div class="head"><h2>${t('ideas')} · ${tr.ideaIds.length}</h2><span class="meta">${t('ideasSheetHint')}</span></div>
      <div class="list chipsx" data-drop="ideas" data-axis="x">
        ${tr.ideaIds.map((id) => `<span class="ichip" data-drag="${id}" data-action="edit-stop" data-id="${id}" style="--c:var(--c-${tr.items[id].category})"><span class="dot"></span>${esc(tr.items[id].title)}</span>`).join('')}
        <button class="ichip add" data-action="add-stop" data-day="">+</button>
      </div>
    </div>`;
}

function initBoard(r) {
  if (r.name !== 'trip' || r.tab !== 'plan') return;
  const tr = getTrip(r.id); const b = document.querySelector('[data-board="plan"]');
  if (!tr || !b) return;
  const d = dayOfDate(tr, TODAY);
  if (d) { const col = document.getElementById('col-' + d.id); if (col) b.scrollLeft = col.offsetLeft - 16 - (col.offsetWidth + 14); }
}
function updateDaysLabel() {
  const b = document.querySelector('[data-board="plan"]'); const lbl = document.getElementById('days-label');
  if (!b || !lbl) return;
  const cols = [...b.querySelectorAll('[data-dayidx]')];
  const L0 = b.scrollLeft, R0 = L0 + b.clientWidth;
  const vis = cols.filter((c) => c.offsetLeft + c.offsetWidth / 2 >= L0 && c.offsetLeft + c.offsetWidth / 2 <= R0).map((c) => +c.dataset.dayidx);
  if (vis.length) lbl.textContent = t('daysRange', { a: Math.min(...vis) + 1, b: Math.max(...vis) + 1, n: cols.length });
}
document.addEventListener('scroll', (e) => { if (e.target.matches && e.target.matches('[data-board="plan"]')) updateDaysLabel(); }, true);

/* ---------- Expenses ---------- */
function renderExpenses(tr) {
  const total = spentOf(tr);
  const st = tripStatus(tr);
  const elapsed = st === 'past' ? tr.days.length : st === 'ongoing' ? diffDays(tr.startDate, TODAY) + 1 : 0;
  const cats = EXP_CATS.map((c) => ({ c, sum: tr.expenses.filter((e) => e.category === c).reduce((s, e) => s + e.amount, 0) })).filter((x) => x.sum > 0).sort((a, b) => b.sum - a.sum);
  const max = cats.length ? cats[0].sum : 0;

  if (!tr.expenses.length) return `
    <div class="card empty"><div class="e-ic">€</div><h2>${t('noExpenses')}</h2><p>${t('noExpensesHint')}</p><button class="btn btn-primary" data-action="add-expense">${t('expAdd')}</button></div>`;

  let list = tr.expenses.filter((e) => ui.expCat === 'all' || e.category === ui.expCat);
  const cmp = {
    dateDesc: (a, b) => (b.date || '').localeCompare(a.date || ''),
    dateAsc: (a, b) => (a.date || '9999').localeCompare(b.date || '9999'),
    amountDesc: (a, b) => b.amount - a.amount,
    amountAsc: (a, b) => a.amount - b.amount,
  }[ui.expSort];
  list = [...list].sort(cmp);
  const listTotal = list.reduce((s, e) => s + e.amount, 0);

  return `
    <div class="exp-layout">
      <div class="exp-side">
        <div class="spent-card">
          <div class="label">${t('spent')}</div>
          <div class="big num">${money(total, tr.currency)}</div>
          <div class="meta">${tp('expensesCount', tr.expenses.length)}${elapsed ? ' · ' + t('perDay', { a: money(Math.round(total / elapsed), tr.currency) }) : ''}</div>
        </div>
        <div class="card cats">
          <div class="label">${t('byCategory')}</div>
          ${cats.map(({ c, sum }) => `
            <div class="cat-row" style="--c:var(--c-${EXP_COLOR[c]})">
              <div class="top"><span class="cat"><span class="dot"></span>${t('cat_' + c)}</span><b>${money(sum, tr.currency)} <span class="meta" style="font-weight:400">· ${Math.round((sum / total) * 100)}%</span></b></div>
              <div class="bar"><i style="width:${(sum / max) * 100}%"></i></div>
            </div>`).join('')}
        </div>
      </div>
      <div class="card exp-table">
        <div class="exp-tools">
          <select class="select pill" data-ui="expCat" aria-label="${t('f_category')}">
            ${['all', ...EXP_CATS].map((c) => `<option value="${c}" ${ui.expCat === c ? 'selected' : ''}>${t('cat_' + c)}</option>`).join('')}
          </select>
          <select class="select pill" data-ui="expSort" aria-label="Sort">

/* ---------- Today ---------- */
function renderToday() {
  const ongoing = state.trips.filter((x) => tripStatus(x) === 'ongoing').sort((a, b) => a.startDate.localeCompare(b.startDate))[0];
  if (ongoing) {
    const tr = ongoing;
    const day = dayOfDate(tr, TODAY);
    const idx = tr.days.indexOf(day);
    const items = day.itemIds.map((id) => tr.items[id]);
    const nm = nowMinutes();
    const end = (i) => toMin(i.time) + (+i.durationMin || 60);
    const current = items.find((i) => !i.done && i.time && toMin(i.time) <= nm && nm < end(i));
    const upcoming = items.filter((i) => !i.done && i !== current && (!i.time || toMin(i.time) >= nm));
    const hero = current || upcoming[0];
    const rest = upcoming.filter((i) => i !== hero);
    const range = (i) => (i.time ? (i.durationMin ? `${i.time}–${fromMin(toMin(i.time) + +i.durationMin)}` : i.time) : '');
    const tg = tasksGroup(tr);
    const todayTasks = sortTasks(tg.items.filter((i) => i.dueDate === TODAY || (i.dueDate && i.dueDate < TODAY && !i.done)));

    let heroHtml;
    if (hero) {
      const lbl = current ? t('nowLbl', { r: range(hero) }) : hero.time ? t('nextLbl', { r: range(hero) }) : t('nextNoTime');
      const sub = [hero.location, hero.note, hero.durationMin ? fmtDur(+hero.durationMin) : ''].filter(Boolean).map(esc).join(' · ');
      heroHtml = `
        <section class="now-card">
          <div class="label">${lbl}</div>
          <h2>${esc(hero.title)}</h2>
          <div class="meta">${sub || t('ic_' + hero.category)}</div>
          <div class="acts">
            <button class="btn" data-action="edit-stop" data-id="${hero.id}" data-trip="${tr.id}">${t('notes')}</button>
            <button class="btn fill" data-action="mark-done" data-id="${hero.id}" data-trip="${tr.id}">${t('doneBtn')}</button>
          </div>
        </section>`;
    } else {
      heroHtml = `<section class="card empty" style="padding:36px 20px;margin-bottom:22px"><div class="e-ic" style="width:80px;height:80px;font-size:30px">✓</div>
        <h2>${items.length ? t('dayDone') : t('noStopsToday')}</h2><p>${items.length ? t('dayDoneHint') : ''}</p>
        <a class="btn" href="#/trips/${tr.id}/plan">${t('openPlan')}</a></section>`;
    }
    return `
      <div class="today">
        <div class="today-head">
          <div><h1>${t('todayTitle', { a: idx + 1, b: tr.days.length })}</h1><div class="meta">${fmtLong(TODAY)} · ${esc(tr.destination)}</div></div>
          <a class="btn btn-sm" href="#/trips/${tr.id}/plan">${t('openPlan')} →</a>
        </div>
        ${heroHtml}
        ${rest.length ? `<div class="label sec-label">${t('next')}</div>
          <div class="stack">${rest.map((i) => `
            <div class="nrow" data-action="edit-stop" data-id="${i.id}" data-trip="${tr.id}" role="button" tabindex="0">
              <div><b>${esc(i.title)}</b><span class="meta">${i.time ? i.time + ' · ' : ''}${t('ic_' + i.category)}</span></div>
              <span class="dot" style="--c:var(--c-${i.category})"></span>
            </div>`).join('')}</div>` : ''}
        <div class="label sec-label">${t('dontForget')}</div>
        <div class="stack">${todayTasks.length ? todayTasks.map((it) => ckRow(tr, tg, it)).join('') : `<div class="meta">${t('nothingToday')}</div>`}</div>
        <button class="btn btn-primary" style="width:100%" data-action="add-expense" data-trip="${tr.id}">${t('expAdd')}</button>
      </div>`;
  }
  const nx = nearestUpcoming();
  if (nx) {
    const r = readiness(nx);
    const tg = tasksGroup(nx);
    const open = sortTasks(tg.items.filter((i) => !i.done));
    return `
      <div class="today">
        <div class="today-head"><div><h1>${t('todayPlain')}</h1><div class="meta">${fmtLong(TODAY)}</div></div></div>
        <section class="card next-trip">
          <div class="label" style="margin-bottom:12px">${t('nextTrip')}</div>
          <div class="row"><div class="av lg ${avClass(nx)}">${avLetter(nx)}</div>
            <div style="flex:1;min-width:0"><h2>${esc(nx.title)}</h2><div class="meta">${fmtRange(nx.startDate, nx.endDate, true)} · ${esc(nx.destination)}</div></div>
            ${statusBadge(nx)}</div>
          <div class="meta" style="display:flex;justify-content:space-between;margin-bottom:6px"><span>${t('ready')}</span><b>${r == null ? '—' : r + '%'}</b></div>
          <div class="bar"><i style="width:${r ?? 0}%"></i></div>
          <a class="btn btn-primary" style="width:100%;margin-top:16px" href="#/trips/${nx.id}/plan">${t('open')}</a>
        </section>
        ${open.length ? `<div class="label sec-label">${t('beforeTrip')}</div><div class="stack">${open.map((it) => ckRow(nx, tg, it)).join('')}</div>` : ''}
      </div>`;
  }
  return `<div class="today"><div class="card empty"><div class="e-ic">◉</div><h2>${t('noTripsNow')}</h2><p>${t('noTripsNowHint')}</p><button class="btn btn-primary" data-action="new-trip">+ ${t('newTrip')}</button></div></div>`;

const modalRoot = document.getElementById('modal-root');
let modal = null;

function openModal({ title, body, submitLabel, danger = false, validate, onSubmit }) {
  modal = { validate, onSubmit, submitted: false, touched: new Set(), returnFocus: document.activeElement };
  modalRoot.innerHTML = `
    <div class="overlay" data-overlay>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title">
        <form id="modal-form" novalidate>
          <header><h2 id="m-title">${title}</h2><button type="button" class="circle-btn sm" data-action="close-modal" aria-label="${t('close')}">×</button></header>
          <div class="form-summary" id="form-summary" hidden></div>
          ${body}
          <footer>
            <button type="button" class="btn" data-action="close-modal">${t('cancel')}</button>
            <button type="submit" class="btn ${danger ? 'btn-danger' : 'btn-primary'}">${submitLabel || t('save')}</button>
          </footer>
        </form>
      </div>
    </div>`;
  const first = modalRoot.querySelector('.input, .select, .textarea') || modalRoot.querySelector('[type=submit]');
  first && first.focus();
}
function closeModal() {
  if (!modal) return;
  const rf = modal.returnFocus; modal = null; modalRoot.innerHTML = '';
  rf && document.contains(rf) && rf.focus();
}
const formData = (form) => Object.fromEntries(new FormData(form).entries());
function showErrors(form) {
  const errs = modal.validate ? modal.validate(formData(form)) : {};
  form.querySelectorAll('.field[data-name]').forEach((f) => {
    const n = f.dataset.name;
    const msg = (modal.submitted || modal.touched.has(n)) ? errs[n] : '';
    f.classList.toggle('invalid', !!msg);
    const e = f.querySelector('.err'); if (e) e.textContent = msg || '';
    const c = f.querySelector('.input, .select, .textarea'); c && c.setAttribute('aria-invalid', msg ? 'true' : 'false');
  });
  const n = Object.keys(errs).length;
  const sum = form.querySelector('#form-summary');
  sum.hidden = !(modal.submitted && n);
  sum.textContent = n ? tp('fixN', n) : '';
  return errs;
}
const field = (name, label, control, { required = false, optional = false, hidden = false } = {}) => `
  <div class="field" data-name="${name}" ${hidden ? 'hidden' : ''}>
    <label for="f-${name}">${label}${required ? ' *' : ''}${optional ? ` <span class="opt">· ${t('optional')}</span>` : ''}</label>
    ${control}
    <div class="err" id="e-${name}"></div>
  </div>`;
const input = (name, value = '', attrs = '') => `<input class="input" id="f-${name}" name="${name}" value="${esc(value)}" aria-describedby="e-${name}" ${attrs}>`;
const select = (name, opts, value) => `<select class="select" id="f-${name}" name="${name}">${opts.map(([v, l]) => `<option value="${v}" ${String(v) === String(value) ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;

/* ---------- Trip form ---------- */
function validateTrip(d) {
  const e = {};
  const title = (d.title || '').trim();
  if (title.length < 2 || title.length > 80) e.title = t('errTitle');
  if (!(d.destination || '').trim()) e.destination = t('errDest');
  if (!d.startDate) e.startDate = t('errDate');
  if (!d.endDate) e.endDate = t('errDate');
  if (d.startDate && d.endDate) {
    if (d.endDate < d.startDate) e.endDate = t('errEndBefore');
    else if (diffDays(d.startDate, d.endDate) + 1 > 60) e.endDate = t('errTooLong');
  }
  if ((d.notes || '').length > 1000) e.notes = t('errNotes');
  return e;
}
function openTripForm(tr) {
  const v = tr || { title: '', destination: '', startDate: '', endDate: '', currency: 'ILS', notes: '' };
  openModal({
    title: tr ? t('editTrip') : t('newTrip'), submitLabel: tr ? t('save') : t('createTrip'),

      ${field('title', t('f_title'), input('title', v.title, `placeholder="${t('ph_title')}" maxlength="90"`), { required: true })}
      ${field('destination', t('f_destination'), input('destination', v.destination, `placeholder="${t('ph_destination')}"`), { required: true })}
      <div class="grid2">
        ${field('startDate', t('f_start'), input('startDate', v.startDate, 'type="date"'), { required: true })}
        ${field('endDate', t('f_end'), input('endDate', v.endDate, 'type="date"'), { required: true })}
      </div>
      ${field('currency', t('f_currency'), select('currency', CURRENCIES.map((c) => [c, c]), v.currency))}
      ${field('notes', t('f_notes'), `<textarea class="textarea" id="f-notes" name="notes" placeholder="${t('ph_notes')}">${esc(v.notes)}</textarea>`, { optional: true })}`,
    validate: validateTrip,
    onSubmit: (d) => {
      const data = { title: d.title.trim(), destination: d.destination.trim(), startDate: d.startDate, endDate: d.endDate, currency: d.currency, notes: d.notes.trim() };
      if (tr) {
        const moved = syncDays(tr, data.startDate, data.endDate);
        Object.assign(tr, data, { updatedAt: Date.now() });
        toast(moved ? t('movedToIdeas', { n: moved }) : t('saved'));
      } else {
        const trip = { id: uid(), ...data, createdAt: Date.now(), updatedAt: Date.now(), days: rangeDates(data.startDate, data.endDate).map((date) => ({ id: uid(), date, itemIds: [] })), ideaIds: [], items: {}, expenses: [], groups: defaultGroups(L()) };
        state.trips.push(trip);
        location.hash = `#/trips/${trip.id}/plan`;
        toast(t('created'));
      }
    },
  });
}
/** Keep days that still fit, add new ones; stops of removed days go to Ideas. */
function syncDays(tr, start, end) {
  const byDate = Object.fromEntries(tr.days.map((d) => [d.date, d]));
  const next = rangeDates(start, end).map((date) => byDate[date] || { id: uid(), date, itemIds: [] });
  let moved = 0;
  tr.days.forEach((d) => {
    if (d.date >= start && d.date <= end) return;
    d.itemIds.forEach((id) => { tr.items[id].dayId = null; tr.ideaIds.push(id); moved++; });
  });
  tr.days = next;
  return moved;
}

      ${item && item.dayId ? `<label class="check-line"><input type="checkbox" class="ck" name="done" ${v.done ? 'checked' : ''}><span>${t('f_done')}</span></label>` : ''}

    validate: (d) => {
      const e = {};
      const title = (d.title || '').trim();
      if (title.length < 2 || title.length > 80) e.title = t('errTitle');
      if (d.time && !/^([01]\d|2[0-3]):[0-5]\d$/.test(d.time)) e.time = 'HH:mm';
      return e;
    },
    onSubmit: (d) => {
      const data = { title: d.title.trim(), category: d.category, time: d.time, durationMin: d.durationMin ? +d.durationMin : '', location: d.location.trim(), note: d.note.trim(), needsBooking: !!d.needsBooking };
      const targetKey = d.where === 'day' ? 'day:' + d.dayId : 'ideas';
      let it = item;
      if (it) {
        Object.assign(it, data);
        if ('done' in d || it.dayId) it.done = !!d.done && d.where === 'day';
        const curKey = it.dayId ? 'day:' + it.dayId : 'ideas';
        if (curKey !== targetKey) moveItem(tr, it.id, targetKey, null);
      } else {
        it = { id: uid(), ...data, bookingTaskId: '', done: false, dayId: null };
        tr.items[it.id] = it;
        moveItem(tr, it.id, targetKey, null);
      }
      syncBooking(tr, it, d.bookBy);
      toast(item ? t('saved') : (it.needsBooking && it.bookingTaskId ? t('taskCreated') : t('saved')));
    },
  });
}
/** needsBooking ↔ task in «Before the trip» */
function syncBooking(tr, it, bookBy) {
  const tg = tasksGroup(tr);
  const linked = it.bookingTaskId ? findCk(tr, it.bookingTaskId) : null;
  if (it.needsBooking) {
    if (linked) { linked.item.text = t('bookPrefix') + it.title; linked.item.dueDate = bookBy || ''; }
    else { const task = { id: uid(), text: t('bookPrefix') + it.title, done: false, dueDate: bookBy || '', sourceItemId: it.id }; tg.items.push(task); it.bookingTaskId = task.id; }
  } else if (linked) {
    linked.group.items = linked.group.items.filter((x) => x.id !== linked.item.id);
    it.bookingTaskId = '';
  }
}
function moveItem(tr, id, key, beforeId) {
  if (beforeId === id) return;
  tr.days.forEach((d) => (d.itemIds = d.itemIds.filter((x) => x !== id)));
  tr.ideaIds = tr.ideaIds.filter((x) => x !== id);
  const list = key === 'ideas' ? tr.ideaIds : tr.days.find((d) => d.id === key.slice(4)).itemIds;
  let at = beforeId ? list.indexOf(beforeId) : list.length;
  if (at < 0) at = list.length;
  list.splice(at, 0, id);
  tr.items[id].dayId = key === 'ideas' ? null : key.slice(4);
  if (!tr.items[id].dayId) tr.items[id].done = false;
}
function deleteStop(tr, id) {
  const it = tr.items[id];
  tr.days.forEach((d) => (d.itemIds = d.itemIds.filter((x) => x !== id)));
  tr.ideaIds = tr.ideaIds.filter((x) => x !== id);
  if (it.bookingTaskId) { const l = findCk(tr, it.bookingTaskId); if (l) l.item.sourceItemId = ''; }
  delete tr.items[id];
}
